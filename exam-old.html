<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="theme-color" content="#f7f4ee" />
        <meta
            name="description"
            content="Find your ULAB's academic exam date, time, section, room and teacher effortlessly."
        />
        <title>YouRMS Exam Finder</title>
        <style>
            :root {
                --paper: #f7f4ee;
                --paper-raised: #fffdf9;
                --ink: #1d1a16;
                --ink-soft: #6b6458;
                --ink-faint: #9a9385;
                --line: #e6e0d2;
                --line-strong: #d7cfba;
                --accent: #b14323;
                --accent-ink: #7c2c14;
                --accent-soft: #f3e3d6;
                --blue: #3679c8;
                --blue-dark: #2b69b3;
                --blue-ink: #20558f;
                --bad: #ad3434;
                --bad-soft: #f6e2e1;
                --serif: "Iowan Old Style", "Palatino Linotype", Palatino,
                    Charter, Georgia, serif;
            }
            *,
            *::before,
            *::after {
                box-sizing: border-box;
            }
            [hidden] {
                display: none !important;
            }
            html,
            body {
                max-width: 100%;
            }
            body {
                margin: 0;
                background: var(--paper);
                color: var(--ink);
                font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto,
                    Arial, sans-serif;
                -webkit-font-smoothing: antialiased;
            }
            h1,
            h2,
            h3,
            p,
            ul {
                margin: 0;
                padding: 0;
            }
            h1,
            h2 {
                font-family: var(--serif);
                font-weight: 600;
                color: var(--blue-ink);
            }
            ul {
                list-style: none;
            }
            button,
            input {
                font: inherit;
                color: inherit;
            }
            a {
                color: var(--blue-ink);
            }
            :focus-visible {
                outline: 2px solid var(--blue);
                outline-offset: 2px;
            }
            .sr-only {
                position: absolute;
                width: 1px;
                height: 1px;
                margin: -1px;
                overflow: hidden;
                clip: rect(0 0 0 0);
                white-space: nowrap;
                border: 0;
            }
            .muted {
                color: var(--ink-soft);
            }
            .code {
                font-weight: 600;
                white-space: nowrap;
            }
            .cname {
                color: var(--ink-soft);
                overflow-wrap: anywhere;
            }
            .icon {
                width: 16px;
                height: 16px;
                flex: none;
                fill: none;
                stroke: currentColor;
                stroke-width: 1.75;
                stroke-linecap: round;
                stroke-linejoin: round;
            }

            /* Buttons */
            .btn {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 6px;
                min-height: 40px;
                padding: 0 16px;
                border: 1px solid var(--blue-dark);
                border-radius: 6px;
                background: var(--blue-dark);
                color: #fff;
                font-size: 14px;
                cursor: pointer;
            }
            .btn:hover {
                background: #1d4f8c;
                border-color: #1d4f8c;
            }
            .btn:disabled {
                opacity: 0.5;
                cursor: not-allowed;
            }
            .text-btn {
                display: inline-flex;
                align-items: center;
                gap: 6px;
                min-height: 36px;
                padding: 0 8px;
                border: 0;
                border-radius: 6px;
                background: none;
                color: var(--ink);
                font-size: 14px;
                cursor: pointer;
            }
            .text-btn:hover {
                background: var(--line);
            }
            .text-btn:disabled {
                color: var(--ink-soft);
                opacity: 0.6;
                cursor: not-allowed;
                background: none;
            }
            .icon-btn {
                display: inline-grid;
                place-items: center;
                flex: none;
                width: 36px;
                height: 36px;
                padding: 0;
                border: 0;
                border-radius: 6px;
                background: none;
                color: var(--ink-soft);
                cursor: pointer;
            }
            .icon-btn:hover {
                background: var(--bad-soft);
                color: var(--bad);
            }

            /* Header */
            .topbar {
                position: sticky;
                top: 0;
                z-index: 100;
                background: rgba(255, 255, 255, 0.96);
                backdrop-filter: blur(16px);
                -webkit-backdrop-filter: blur(16px);
                border-bottom: 1px solid #e8edf4;
            }
            .topbar-inner {
                max-width: 860px;
                min-height: 68px;
                margin: 0 auto;
                padding: 8px 16px;
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 16px;
            }
            .brand {
                display: inline-flex;
                align-items: center;
                flex-shrink: 0;
                border-radius: 10px;
                text-decoration: none;
                transition: opacity 0.2s ease, transform 0.2s ease;
            }
            .brand img {
                display: block;
                width: auto;
                height: 54px;
                max-width: 55vw;
                object-fit: contain;
            }
            .brand:hover {
                opacity: 0.85;
            }
            .brand:active {
                transform: scale(0.97);
            }

            main {
                width: 100%;
                max-width: 860px;
                min-width: 0;
                margin: 0 auto;
                padding: 0 16px 48px;
            }
            .block {
                margin-top: 28px;
                min-width: 0;
            }
            h2 {
                font-size: 22px;
                line-height: 1.2;
                margin-bottom: 12px;
            }
            h2 .count {
                margin-left: 6px;
                color: var(--ink-soft);
                font-weight: 400;
                font-size: 16px;
            }

            /* Add courses */
            .add-row {
                display: flex;
                gap: 8px;
                min-width: 0;
            }
            .search-box {
                position: relative;
                flex: 1;
                min-width: 0;
            }
            .field {
                display: flex;
                align-items: center;
                gap: 8px;
                min-height: 40px;
                padding: 0 10px;
                border: 1px solid var(--line-strong);
                border-radius: 6px;
                background: var(--paper-raised);
                color: var(--ink-soft);
            }
            .field:focus-within {
                border-color: var(--blue);
                box-shadow: 0 0 0 3px rgba(32, 85, 143, 0.18);
            }
            .field input {
                flex: 1;
                min-width: 0;
                border: 0;
                outline: 0;
                background: transparent;
                color: var(--ink);
            }
            .field input::placeholder {
                color: #9a9385;
            }
            .picker {
                position: absolute;
                z-index: 10;
                left: 0;
                right: 0;
                top: calc(100% + 4px);
                background: var(--paper-raised);
                border: 1px solid var(--line-strong);
                border-radius: 8px;
                overflow: hidden;
                box-shadow: 0 8px 24px -14px rgba(25, 43, 69, 0.35);
            }
            .picker-bar {
                display: flex;
                align-items: center;
                gap: 2px;
                padding: 2px 6px 2px 12px;
                border-bottom: 1px solid var(--line);
                font-size: 13px;
                color: var(--ink-soft);
            }
            .picker-bar .count {
                flex: 1;
            }
            .picker-bar .text-btn {
                min-height: 34px;
                font-size: 13px;
            }
            .picker-list {
                max-height: min(320px, 50vh);
                overflow: auto;
                padding: 4px;
            }
            .opt {
                display: grid;
                grid-template-columns: 18px 5.5rem minmax(0, 1fr) auto;
                gap: 10px;
                align-items: center;
                min-height: 44px;
                padding: 6px 8px;
                border-radius: 5px;
                cursor: pointer;
            }
            .opt:hover,
            .opt.active {
                background: var(--line);
            }
            .opt.is-added {
                cursor: default;
                color: var(--ink-soft);
            }
            .opt.is-added:hover {
                background: transparent;
            }
            .box {
                width: 18px;
                height: 18px;
                display: grid;
                place-items: center;
                border: 1.5px solid var(--line-strong);
                border-radius: 4px;
                background: var(--paper-raised);
                color: #fff;
            }
            .box .icon {
                width: 12px;
                height: 12px;
                stroke-width: 3;
                opacity: 0;
            }
            .opt[aria-selected="true"] .box {
                background: var(--ink);
                border-color: var(--ink);
            }
            .opt[aria-selected="true"] .box .icon {
                opacity: 1;
            }
            .opt.is-added .box {
                background: var(--line-strong);
                border-color: var(--line-strong);
            }
            .oname {
                display: flex;
                flex-direction: column;
                min-width: 0;
                line-height: 1.3;
                overflow-wrap: anywhere;
            }
            .oname small {
                color: var(--ink-soft);
                font-size: 12px;
            }
            .opt .tag {
                font-size: 12px;
                color: var(--ink-soft);
            }
            .picker-empty {
                padding: 14px 10px;
                color: var(--ink-soft);
                font-size: 14px;
            }

            /* Selected courses */
            .course-list {
                margin-top: 12px;
                border-top: 1px solid var(--line);
                min-width: 0;
            }
            .course {
                padding: 14px 0;
                border-bottom: 1px solid var(--line);
                min-width: 0;
            }
            .course.is-new {
                animation: fade 1.4s ease-out;
            }
            @keyframes fade {
                from {
                    background: var(--accent-soft);
                }
                to {
                    background: transparent;
                }
            }
            .c-head {
                display: flex;
                align-items: center;
                gap: 8px;
                min-width: 0;
            }
            .c-title {
                flex: 1;
                min-width: 0;
                display: flex;
                flex-wrap: wrap;
                align-items: baseline;
                gap: 0 10px;
            }
            .c-title .code {
                font-size: 16px;
            }
            .sections {
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                gap: 6px;
                margin-top: 6px;
            }
            .sections .lbl {
                margin-right: 4px;
                font-size: 13px;
                color: var(--ink-soft);
            }
            .chip {
                min-width: 40px;
                height: 34px;
                padding: 0 10px;
                border: 1px solid var(--line-strong);
                border-radius: 6px;
                background: var(--paper-raised);
                font-size: 14px;
                cursor: pointer;
            }
            .chip:hover {
                border-color: var(--blue);
            }
            .chip[aria-pressed="true"] {
                background: var(--ink);
                border-color: var(--ink);
                color: var(--paper-raised);
                font-weight: 600;
            }
            .exam {
                display: flex;
                flex-wrap: wrap;
                margin-top: 8px;
                font-size: 14px;
            }
            .exam > * + *::before {
                content: "·";
                margin: 0 8px;
                color: var(--ink-soft);
            }
            .exam .soft {
                color: var(--ink-soft);
            }
            .empty {
                padding: 14px 0;
                color: var(--ink-soft);
                font-size: 14px;
                border-bottom: 1px solid var(--line);
            }
            .alert {
                padding: 12px;
                border: 1px solid #f0c9ce;
                background: var(--bad-soft);
                color: #842b34;
                border-radius: 6px;
                font-size: 14px;
            }
            .alert code {
                overflow-wrap: anywhere;
            }

            /* Schedule */
            .view-bar {
                display: flex;
                align-items: flex-end;
                justify-content: space-between;
                gap: 12px;
                border-bottom: 1px solid var(--line);
                min-width: 0;
            }
            .tabs {
                display: flex;
                gap: 20px;
                min-width: 0;
            }
            .tab {
                margin-bottom: -1px;
                padding: 8px 0;
                border: 0;
                border-bottom: 2px solid transparent;
                background: none;
                color: var(--ink-soft);
                font-size: 15px;
                cursor: pointer;
            }
            .tab:hover {
                color: var(--ink);
            }
            .tab[aria-pressed="true"] {
                color: var(--ink);
                font-weight: 600;
                border-bottom-color: var(--ink);
            }
            .view-bar .text-btn {
                margin-bottom: 2px;
            }
            .note {
                padding: 16px 0;
                color: var(--ink-soft);
                font-size: 14px;
            }
            #schedulePanel {
                width: 100%;
                max-width: 100%;
                min-width: 0;
            }
            .cards {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
                gap: 12px;
                margin-top: 14px;
                min-width: 0;
            }
            .card {
                display: flex;
                flex-direction: column;
                min-width: 0;
                padding: 12px 14px;
                border: 1px solid var(--line-strong);
                border-radius: 6px;
                background: var(--paper-raised);
            }
            .card-date {
                display: flex;
                align-items: baseline;
                justify-content: space-between;
                gap: 8px;
                padding-bottom: 8px;
                border-bottom: 1px solid var(--line);
            }
            .card-date strong {
                font-family: var(--serif);
                font-size: 17px;
                font-weight: 600;
            }
            .card-time {
                margin-top: 8px;
                font-size: 14px;
            }
            .card-course {
                margin-top: 2px;
                overflow-wrap: anywhere;
            }
            .card-meta {
                margin-top: 6px;
                font-size: 13px;
                color: var(--ink-soft);
                overflow-wrap: anywhere;
            }
            .card-meta div + div {
                margin-top: 1px;
            }
            .card-foot {
                margin-top: auto;
                padding-top: 8px;
            }
            .cal-link {
                display: inline-flex;
                align-items: center;
                gap: 6px;
                min-height: 32px;
                padding: 0 8px 0 0;
                border-radius: 5px;
                color: var(--ink);
                font-size: 13px;
                text-decoration: none;
                white-space: nowrap;
            }
            .cal-link:hover {
                text-decoration: underline;
            }
            td .cal-link {
                padding: 0 8px;
            }
            td .cal-link:hover {
                background: var(--line);
                text-decoration: none;
            }

            /* Keep wide schedule tables inside their own scroll area on small screens. */
            .table-wrap {
                display: block;
                width: 100%;
                max-width: 100%;
                min-width: 0;
                margin-top: 8px;
                overflow-x: auto;
                overflow-y: hidden;
                overscroll-behavior-x: contain;
                -webkit-overflow-scrolling: touch;
            }
            table {
                width: 100%;
                min-width: 720px;
                border-collapse: collapse;
            }
            th {
                padding: 8px 10px;
                border-bottom: 1px solid var(--line-strong);
                text-align: left;
                font-size: 12px;
                font-weight: 600;
                color: var(--ink-soft);
                white-space: nowrap;
            }
            td {
                padding: 10px;
                border-bottom: 1px solid var(--line);
                vertical-align: top;
                font-size: 14px;
            }
            td.nowrap {
                white-space: nowrap;
            }
            td .cname {
                display: block;
                font-size: 13px;
            }
            tr:last-child td {
                border-bottom: 0;
            }

            /* Calendar: one continuous grid, week by week */
            .cal {
                margin-top: 12px;
                border: 1px solid var(--line-strong);
                border-radius: 6px;
                background: var(--paper-raised);
                overflow: hidden;
                max-width: 100%;
            }
            .cal-wd,
            .cal-grid {
                display: grid;
                grid-template-columns: repeat(7, minmax(0, 1fr));
            }
            .cal-wd div {
                padding: 6px 8px;
                border-bottom: 1px solid var(--line-strong);
                background: var(--line);
                font-size: 12px;
                color: var(--ink-soft);
            }
            .cal-day {
                min-width: 0;
                min-height: 88px;
                padding: 6px 4px;
                border-right: 1px solid var(--line);
                border-bottom: 1px solid var(--line);
            }
            .cal-day:nth-child(7n) {
                border-right: 0;
            }
            .cal-grid .cal-day:nth-last-child(-n + 7) {
                border-bottom: 0;
            }
            .cal-day.extra {
                background: #f2eee5;
            }
            .cal-day.extra .d {
                color: #9a9385;
            }
            .cal-day.today {
                background: var(--accent-soft);
            }
            .cal-day.today .d {
                color: var(--accent-ink);
                font-weight: 600;
            }
            .d {
                padding: 0 4px 2px;
                font-size: 12px;
            }
            .d.first {
                color: var(--ink);
                font-weight: 600;
            }
            .ev {
                margin-top: 4px;
                padding: 4px 6px;
                border-left: 2px solid var(--accent);
                border-radius: 0 4px 4px 0;
                background: var(--accent-soft);
                font-size: 12px;
                line-height: 1.35;
            }
            .ev-top {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 4px;
                font-size: 11px;
                color: var(--ink-soft);
            }
            .ev-code {
                font-weight: 600;
                overflow-wrap: anywhere;
            }
            .ev-room {
                font-size: 11px;
                color: var(--ink-soft);
                overflow-wrap: anywhere;
            }
            .ev-cal {
                display: grid;
                place-items: center;
                width: 22px;
                height: 22px;
                margin: -3px -4px -3px 0;
                border-radius: 4px;
                color: var(--ink);
            }
            .ev-cal:hover {
                background: var(--paper-raised);
            }

            .toast-stack {
                position: fixed;
                z-index: 100;
                left: 50%;
                bottom: 16px;
                transform: translateX(-50%);
                display: grid;
                gap: 6px;
                width: min(380px, calc(100vw - 24px));
                pointer-events: none;
            }
            .toast {
                padding: 10px 12px;
                border: 1px solid var(--line-strong);
                border-radius: 6px;
                background: var(--paper-raised);
                box-shadow: 0 6px 20px -10px rgba(25, 43, 69, 0.4);
                font-size: 14px;
                pointer-events: auto;
            }
            .toast.error {
                border-color: #f0c9ce;
                background: var(--bad-soft);
                color: #842b34;
            }

            /* Footer */
            .site-footer {
                background: var(--paper);
                
                bottom: 0;
                left: 0;
                width: 100%;
                z-index: 100;
                max-width: 100%;
                margin: 0 auto;
                padding: 18px 16px 24px;
                border-top: 1px solid var(--line);
                color: var(--ink-soft);
                font-size: 13px;
                text-align: center;
            }
            .site-footer a {
                color: var(--blue-ink);
            }
            .site-footer a:hover {
                text-decoration-style: dashed;
            }

            @media (max-width: 640px) {
                .brand span {
                    display: none;
                }
                .opt {
                    grid-template-columns: 18px 5rem minmax(0, 1fr) auto;
                    gap: 8px;
                }
                .cards {
                    grid-template-columns: 1fr;
                }
                .cal-day {
                    min-height: 64px;
                    padding: 4px 2px;
                }
                .d {
                    padding: 0 2px 2px;
                    font-size: 11px;
                }
                .ev {
                    padding: 3px;
                    font-size: 10px;
                }
                .ev-top {
                    font-size: 9px;
                }
                .ev-room,
                .ev-cal {
                    display: none;
                }
                .cal-wd div {
                    padding: 6px 2px;
                    text-align: center;
                    font-size: 11px;
                }
                .tabs {
                    gap: 14px;
                }
                .view-bar {
                    flex-wrap: wrap;
                    align-items: center;
                }
                .view-bar .text-btn {
                    margin-bottom: 4px;
                }
            }
            @media (max-width: 480px) {
                .topbar-inner {
                    min-height: 62px;
                    padding: 8px 14px;
                    gap: 10px;
                }
                .brand img {
                    height: 36px;
                    max-width: 52vw;
                }
            }
            @media (prefers-reduced-motion: reduce) {
                *,
                *::before,
                *::after {
                    animation: none !important;
                    transition: none !important;
                }
            }
        </style>
    </head>
    <body>
        <svg
            width="0"
            height="0"
            style="position: absolute"
            aria-hidden="true"
            focusable="false"
        >
            <defs>
                <symbol id="i-search" viewBox="0 0 24 24">
                    <circle cx="11" cy="11" r="7" />
                    <path d="m20 20-3.5-3.5" />
                </symbol>
                <symbol id="i-x" viewBox="0 0 24 24">
                    <path d="M18 6 6 18M6 6l12 12" />
                </symbol>
                <symbol id="i-check" viewBox="0 0 24 24">
                    <path d="M20 6 9 17l-5-5" />
                </symbol>
                <symbol id="i-calendar-plus" viewBox="0 0 24 24">
                    <rect x="3" y="4" width="18" height="17" rx="2" />
                    <path d="M8 2v4M16 2v4M3 10h18M12 13v5M9.5 15.5h5" />
                </symbol>
                <symbol id="i-download" viewBox="0 0 24 24">
                    <path d="M12 3v12M7 10l5 5 5-5M5 21h14" />
                </symbol>
            </defs>
        </svg>

        <header class="topbar">
            <div class="topbar-inner">
                <a
                    class="brand"
                    href="https://theyourms.github.io/exam"
                    aria-label="YouRMS Exam Finder"
                >
                    <img
                        src="https://theyourms.github.io/YouRMS_Exam_Finder.png"
                        alt="YouRMS Exam Finder"
                    />
                </a>
            </div>
        </header>

        <main>
            <section class="block" aria-labelledby="coursesTitle">
                <h2 id="coursesTitle">
                    Your Courses<span id="courseCount" class="count"></span>
                </h2>
                <div class="add-row" id="addRow">
                    <div class="search-box">
                        <div class="field">
                            <svg
                                class="icon"
                                aria-hidden="true"
                                focusable="false"
                            >
                                <use href="#i-search" />
                            </svg>
                            <input
                                id="courseSearch"
                                type="text"
                                placeholder="Search course code or name"
                                autocomplete="off"
                                autocapitalize="characters"
                                spellcheck="false"
                                role="combobox"
                                aria-label="Search courses"
                                aria-autocomplete="list"
                                aria-expanded="false"
                                aria-controls="pickerList"
                                disabled
                            />
                        </div>
                        <div id="picker" class="picker" hidden>
                            <div class="picker-bar">
                                <span
                                    class="count"
                                    id="pickerCount"
                                    aria-live="polite"
                                ></span>

            <section class="block" aria-labelledby="scheduleTitle">

        <footer class="site-footer">
            <p>
                <a href="https://theyourms.github.io/exam">YouRMS Exam

                <a href="https://fb.com/md.shahriar.alam.sikey"> Shahriar </a>
            </p>
        </footer>

        <div
            id="toastStack"
            class="toast-stack"
            role="status"
            aria-live="polite"
        ></div>

        <script>
            (() => {
              'use strict';

              /* Configuration */
              const WORKBOOK_URL = 'https://theyourms.github.io/263/mid.xlsx';
              const COURSE_DATA_URL = 'https://theyourms.github.io/263/course_data.js';
              const STORAGE_KEY = 'yourms-exam-finder-fall-2026-v1';
              const TIME_ZONE = 'Asia/Dhaka';
              const VIEWS = ['table', 'cards', 'calendar'];
              const SHEETJS_SOURCES = [
                'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js',
                'https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js'
              ];

              /* Course names */
              const COURSE_CATALOG = [
                { code: 'CSE 3203', name: 'Software Engineering', ids: [] },
                { code: 'BUS 1101', name: 'Introduction to Business', ids: ['0410-011-1101'] },
                { code: 'GEF 1101', name: 'Academic English I', ids: ['0231-000-1101'] },
                { code: 'ELL 0099', name: 'Remedial English', ids: ['0231-000-0099'] },
                { code: 'UCC 1101', name: 'Bangla Bhasha O Shahitya', ids: ['0232-000-1101'] },
                { code: 'MAT 0099', name: 'Remedial Math/Basic Math', ids: ['0541-011-0099'] },
                { code: 'ESK 1110', name: 'Study Skills', ids: ['0031-000-1110'] }
              ];

              const normalizeSpaces = value => String(value ?? '').replace(/\r/g, '').replace(/[   ]/g, ' ').replace(/[\t ]+/g, ' ').replace(/\n+/g, ' ').trim();
              const cleanText = value => String(value ?? '').replace(/\r/g, '').replace(/[   ]/g, ' ').trim();
              const escapeHTML = value => String(value ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
              const esc = escapeHTML;
              const pad2 = value => String(value).padStart(2, '0');
              const dateKey = date => `${date.getFullYear()}-${pad2(date.getMonth() + 1)}-${pad2(date.getDate())}`;
              const compareCodes = (a, b) => a.localeCompare(b, 'en', { numeric: true });
              const fmtDateLong = new Intl.DateTimeFormat('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
              const fmtDateCompact = new Intl.DateTimeFormat('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
              const fmtDateShort = new Intl.DateTimeFormat('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
              const fmtMonthShort = new Intl.DateTimeFormat('en-GB', { month: 'short' });
              const WEEKDAY_LABELS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

              function normalizeCode(value) {
                let q = String(value ?? '').toUpperCase().replace(/[–—]/g, '-').trim();
                q = q.replace(/[^A-Z0-9]+/g, ' ').replace(/\s+/g, ' ').trim();
                const glued = q.match(/^([A-Z]{2,6})\s*(\d{3,5})$/);
                if (glued) q = `${glued[1]} ${glued[2]}`;
                return q;
              }

              const CourseCatalog = (() => {
                const names = new Map(), idsByCode = new Map(), codeById = new Map();
                const compact = value => String(value ?? '').toUpperCase().replace(/[^A-Z0-9]/g, '');
                const ID_PATTERN = /^\d{3,5}-\d{2,4}-\d{4}$/;
                const CODE_PATTERN = /^[A-Z]{2,6} \d{3,5}$/;
                function link(code, id) {
                  codeById.set(compact(id), code);
                  if (!idsByCode.has(code)) idsByCode.set(code, []);
                  if (!idsByCode.get(code).includes(id)) idsByCode.get(code).push(id);
                }
                function loadBuiltIn() {
                  names.clear(); idsByCode.clear(); codeById.clear();
                  COURSE_CATALOG.forEach(entry => {
                    const code = normalizeCode(entry.code);
                    names.set(code, entry.name);
                    (entry.ids || []).forEach(id => link(code, id));
                  });
                }
                function loadData(data) {
                  const codes = [], ids = [];
                  Object.keys(data).forEach(key => {
                    const name = normalizeSpaces(data[key]), trimmed = String(key).trim();
                    if (!name) return;
                    if (ID_PATTERN.test(trimmed)) { ids.push([trimmed, name]); return; }
                    const code = normalizeCode(trimmed);
                    if (CODE_PATTERN.test(code)) codes.push([code, name]);
                  });
                  codes.forEach(([code, name]) => names.set(code, name));
                  ids.forEach(([id, name]) => {
                    const tail = id.slice(-4);
                    codes.filter(([code, codeName]) => code.endsWith(' ' + tail) && codeName === name).forEach(([code]) => link(code, id));
                  });
                  return codes.length;
                }
                loadBuiltIn();
                return { compact, loadBuiltIn, loadData, nameFor: code => names.get(code) || '', idsFor: code => idsByCode.get(code) || [], codeForId: id => codeById.get(compact(id)) || null };
              })();

              function icon(name) { return `<svg class="icon" aria-hidden="true" focusable="false"><use href="#i-${name}"/></svg>`; }

              /* Workbook parsing */
              function extractAliases(raw) {
                const s = String(raw ?? '').toUpperCase().replace(/[–—]/g, '-').replace(/[   ]/g, ' ');
                const aliases = new Set(), roomPrefixes = new Set(['PA', 'PB', 'PC', 'PD']);
                const direct = /\b([A-Z]{2,6})\s*[- ]?\s*(\d{3,5})\b/g;
                let m;
                while ((m = direct.exec(s)) !== null) if (!roomPrefixes.has(m[1])) aliases.add(`${m[1]} ${m[2]}`);
                const prefix = s.match(/^\s*([A-Z]{2,6})\b/);
                const encoded = s.match(/\b\d{3,5}\s*[-]\s*\d{2,4}\s*[-]\s*(\d{4})\b/);
                const prefixAlreadyNamed = prefix && [...aliases].some(alias => alias.startsWith(`${prefix[1]} `));
                if (prefix && encoded && !prefixAlreadyNamed) aliases.add(`${prefix[1]} ${encoded[1]}`);
                return [...aliases].map(normalizeCode).filter(code => /^[A-Z]{2,6} \d{3,5}$/.test(code));
              }

              function isHeaderRow(row) {
                const a = normalizeSpaces(row?.[0]).toLowerCase(), b = normalizeSpaces(row?.[1]).toLowerCase();
                return (a.includes('day') && a.includes('time')) || (b.includes('am') && normalizeSpaces(row?.[2]).toLowerCase().includes('pm') && a === '');
              }

              function parseDateRow(value) {
                const s = normalizeSpaces(value);
                if (!s || /day\s*\/?\s*time/i.test(s)) return null;
                const m = s.match(/\b(\d{1,2})\s*[/.-]\s*(\d{1,2})\s*[/.-]\s*(\d{4})\b/);
                if (!m) return null;
                const day = Number(m[1]), month = Number(m[2]), year = Number(m[3]);
                const date = new Date(year, month - 1, day, 12, 0, 0);
                if (Number.isNaN(date.getTime()) || date.getFullYear() !== year || date.getMonth() !== month - 1 || date.getDate() !== day) return null;
                return { date };
              }

              function to12Hour(value) {
                const m = String(value).match(/(\d{1,2})(?::(\d{2}))?\s*(am|pm)/i);
                if (!m) return null;
                return `${Number(m[1])}:${m[2] || '00'} ${m[3].toUpperCase()}`;
              }

              function cleanTimeRange(value) {
                const s = normalizeSpaces(value).replace(/[：]/g, ':').replace(/\s*:\s*(?=\d{1,2}:\d{2})/g, ' - ');
                const parts = [...s.matchAll(/\d{1,2}(?::\d{2})?\s*(?:am|pm)/ig)].map(x => to12Hour(x[0])).filter(Boolean);
                if (parts.length >= 2) return `${parts[0]} – ${parts[1]}`;
                return s;
              }

              function findRoom(raw) { return /\b(P[A-Z]{0,2})\s*[- ]?\s*(\d{3})\b/i.exec(String(raw ?? '')); }

              function parseSection(raw, roomMatch) {
                const s = String(raw ?? '').replace(/[–—]/g, '-'), cut = roomMatch ? roomMatch.index : s.length;
                const before = s.slice(0, cut);
                const matches = [...before.matchAll(/[-]\s*(\d{1,2}\s*[Ll]?)\s*[-]\s*$/g)];
                if (matches.length) return normalizeSpaces(matches[matches.length - 1][1]).replace(/\s+/g, '').toUpperCase();
                const fallback = [...before.matchAll(/(?:^|\s[-/]\s*|[-])\s*(\d{1,2}[Ll]?)\s*$/g)];
                if (fallback.length) {
                  const candidate = fallback[fallback.length - 1][1].replace(/\s/g, '').toUpperCase();
                  if (/^\d{1,2}L?$/.test(candidate)) return candidate;
                }
                return '';
              }

              function parseRoomAndTeacher(raw, roomMatch) {
                if (!roomMatch) return { room: '', instructor: '' };
                const text = String(raw ?? ''), tail = text.slice(roomMatch.index);
                const teacherSep = tail.match(/\s*[-–]\s*([A-Za-z][A-Za-z0-9 .,&/()'+-]*?)\s*$/);
                if (teacherSep) {
                  const sepIndex = tail.lastIndexOf(teacherSep[0]);
                  const room = normalizeSpaces(tail.slice(0, sepIndex)).replace(/[-–]+\s*$/, '').trim();
                  const instructor = normalizeSpaces(teacherSep[1]).replace(/\s+$/, '');
                  return { room: room || `${roomMatch[1].toUpperCase()} ${roomMatch[2]}`, instructor };
                }
                const afterBase = tail.slice(roomMatch[0].length).trim();
                const room = normalizeSpaces(`${roomMatch[1].toUpperCase()} ${roomMatch[2]}${afterBase.startsWith('(') ? ' ' + afterBase.split(/\s[-–]\s/)[0] : ''}`);
                return { room, instructor: '' };
              }

              function timeStartMinutes(value) {
                const m = String(value || '').match(/(\d{1,2})(?::(\d{2}))?\s*(AM|PM)/i);
                if (!m) return 9999;
                let hours = Number(m[1]) % 12;
                if (m[3].toUpperCase() === 'PM') hours += 12;
                return hours * 60 + Number(m[2] || 0);
              }

              function parseTimeRange(text) {
                const matches = [...String(text || '').matchAll(/(\d{1,2})(?::(\d{2}))?\s*(AM|PM)/ig)];
                if (matches.length < 2) return null;
                const toMinutes = m => {
                  let hours = Number(m[1]) % 12;
                  if (m[3].toUpperCase() === 'PM') hours += 12;
                  return hours * 60 + Number(m[2] || 0);
                };
                const start = toMinutes(matches[0]), end = toMinutes(matches[1]);
                return end > start ? { start, end } : null;
              }

              function sortEntries(entries) {
                return entries.sort((a, b) => (a.date?.getTime() ?? 0) - (b.date?.getTime() ?? 0) || timeStartMinutes(a.time) - timeStartMinutes(b.time) || a.col - b.col || a.rowNo - b.rowNo);
              }

              function buildWorkbookRows(sheet) {
                const range = window.XLSX.utils.decode_range(sheet['!ref'] || 'A1:E1'), rows = [];
                for (let r = range.s.r; r <= range.e.r; r++) {
                  const row = [];
                  for (let c = range.s.c; c <= range.e.c; c++) {
                    const cell = sheet[window.XLSX.utils.encode_cell({ r, c })];
                    let value = '';
                    if (cell) { if (cell.w !== undefined && cell.w !== null) value = String(cell.w); else if (cell.v !== undefined && cell.v !== null) value = String(cell.v); }
                    row.push(value);
                  }
                  rows.push(row);
                }
                return { rows, startRow: range.s.r + 1 };
              }

              function parseWorkbook(rows, startRow = 1) {
                const index = new Map(), allEntries = [];
                let activeDate = null, timeHeaders = [];
                rows.forEach((row, localIndex) => {
                  const excelRow = startRow + localIndex, parsedDate = parseDateRow(row[0]);
                  if (parsedDate) activeDate = parsedDate;
                  if (isHeaderRow(row)) { timeHeaders = row.map((value, i) => (i === 0 ? 'Day / Time' : cleanTimeRange(value))); return; }
                  if (!activeDate) return;
                  for (let col = 1; col < row.length; col++) {
                    const raw = cleanText(row[col]);
                    if (!normalizeSpaces(raw)) continue;
                    const aliases = extractAliases(raw);
                    if (!aliases.length) continue;
                    const roomMatch = findRoom(raw), parsedRoom = parseRoomAndTeacher(raw, roomMatch);
                    const event = { rowNo: excelRow, col, aliases, section: parseSection(raw, roomMatch), room: parsedRoom.room, instructor: parsedRoom.instructor, date: new Date(activeDate.date.getTime()), time: timeHeaders[col] || '' };
                    allEntries.push(event);
                    aliases.forEach(alias => { if (!index.has(alias)) index.set(alias, []); index.get(alias).push(event); });
                  }
                });
                for (const [code, entries] of index) index.set(code, sortEntries(entries));
                state.courses = index;
                return { courseCount: index.size, entryCount: allEntries.length };
              }

              /* State and persistence */
              const state = { loaded: false, courses: new Map(), selected: [], selectedSections: new Map(), view: 'table', picker: { items: [], active: -1, checked: new Set() } };
              const Store = {
                read() {
                  try { const raw = localStorage.getItem(STORAGE_KEY), saved = raw ? JSON.parse(raw) : null; return saved && typeof saved === 'object' ? saved : null; }
                  catch (error) { console.warn('Could not read saved exam finder state', error); return null; }
                },
                write(payload) {
                  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(payload)); }
                  catch (error) { console.warn('Could not save saved exam finder state', error); }
                }
              };
              function applySavedState(saved) {
                if (!saved) return;
                const savedView = saved.currentView === 'list' ? 'cards' : saved.currentView;
                if (VIEWS.includes(savedView)) state.view = savedView;
                if (Array.isArray(saved.selected)) state.selected = [...new Set(saved.selected.filter(c => typeof c === 'string').map(normalizeCode))];
                const sections = saved.selectedSections && typeof saved.selectedSections === 'object' ? saved.selectedSections : {};
                Object.keys(sections).forEach(code => { if (typeof sections[code] === 'string') state.selectedSections.set(normalizeCode(code), sections[code]); });
              }
              function validateSelection() {
                state.selected = state.selected.filter(code => state.courses.has(code));
                for (const [code, key] of [...state.selectedSections]) if (!state.selected.includes(code) || !getSectionGroups(code).some(group => group.key === key)) state.selectedSections.delete(code);
              }
              function saveState() {
                if (!state.loaded) return;
                Store.write({ selected: state.selected, selectedSections: Object.fromEntries(state.selectedSections), currentView: state.view });
              }

              /* Course lookup and sections */
              function matchCourse(code, q) {
                const c = CourseCatalog.compact(code), ids = CourseCatalog.idsFor(code), idKeys = ids.map(CourseCatalog.compact);
                const nameKey = CourseCatalog.nameFor(code).toLowerCase().replace(/[^a-z0-9]/g, '');
                if (c === q) return { rank: 0, via: '' };
                if (c.startsWith(q)) return { rank: 1, via: '' };
                let i = idKeys.findIndex(key => key.startsWith(q));
                if (i >= 0) return { rank: 2, via: ids[i] };
                if (c.includes(q)) return { rank: 3, via: '' };
                if (q.length >= 3) {
                  i = idKeys.findIndex(key => key.includes(q));
                  if (i >= 0) return { rank: 4, via: ids[i] };
                  if (nameKey.includes(q.toLowerCase())) return { rank: 5, via: '' };
                }
                return null;
              }
              function pickerItems() {
                const q = CourseCatalog.compact(els.search.value), codes = [...state.courses.keys()];
                if (!q) return codes.sort(compareCodes).map(code => ({ code, via: '' }));
                const hits = [];
                codes.forEach(code => { const hit = matchCourse(code, q); if (hit) hits.push({ code, rank: hit.rank, via: hit.via }); });
                hits.sort((a, b) => a.rank - b.rank || compareCodes(a.code, b.code));
                return hits;
              }
              function resolveTypedCode(raw) {
                const q = CourseCatalog.compact(raw);
                if (!q) return null;
                for (const code of state.courses.keys()) if (CourseCatalog.compact(code) === q) return code;
                const viaId = CourseCatalog.codeForId(raw);
                return viaId && state.courses.has(viaId) ? viaId : null;
              }
              function sectionOrder(section) {
                const m = String(section || '').match(/^(\d+)(L?)$/i);
                return m ? [parseInt(m[1], 10), m[2] ? 1 : 0] : [9999, 0];
              }
              function getSectionGroups(code) {
                const entries = state.courses.get(code) || [], groups = new Map();
                entries.forEach(event => {
                  const key = event.section ? `section:${event.section}` : `unknown:${event.rowNo}:${event.col}`;
                  if (!groups.has(key)) groups.set(key, { key, section: event.section, events: [] });
                  groups.get(key).events.push(event);
                });
                const list = [...groups.values()];
                list.forEach(group => sortEntries(group.events));
                list.sort((a, b) => { const [an, al] = sectionOrder(a.section), [bn, bl] = sectionOrder(b.section); return an - bn || al - bl || a.events[0].date - b.events[0].date || a.key.localeCompare(b.key); });
                return list;
              }
              function enrichEvent(event, code, section) { return { ...event, courseCode: code, courseName: CourseCatalog.nameFor(code), selectedSection: section ?? event.section }; }
              function getScheduleEvents() {
                const output = [];
                state.selected.forEach(code => {
                  const key = state.selectedSections.get(code);
                  if (!key) return;
                  const group = getSectionGroups(code).find(item => item.key === key);
                  if (group) group.events.forEach(event => output.push(enrichEvent(event, code, group.section)));
                });
                return sortEntries(output);
              }
              const timeLabel = event => event.time || 'Time not stated';
              function startTimeLabel(event) { const m = String(event.time || '').match(/\d{1,2}(?::\d{2})?\s*(?:AM|PM)/i); return m ? m[0] : ''; }
              function metaParts(event) { return [`Section ${event.selectedSection || 'not listed'}`, `Room ${event.room || 'not listed'}`, `Teacher ${event.instructor || 'not listed'}`]; }

              /* Google Calendar */
              function formatGCalDate(date, minutes) {
                const base = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate(), 0, minutes, 0));
                return `${base.getUTCFullYear()}${pad2(base.getUTCMonth() + 1)}${pad2(base.getUTCDate())}T${pad2(base.getUTCHours())}${pad2(base.getUTCMinutes())}00`;
              }
              function googleCalendarURL(event) {
                const code = event.courseCode, times = parseTimeRange(event.time);
                const title = `${code}${event.courseName ? ' ' + event.courseName : ''} – Midterm Exam`;
                const details = [`Course: ${code}${event.courseName ? ' – ' + event.courseName : ''}`, `Section: ${event.selectedSection || 'not listed'}`, `Room: ${event.room || 'not listed'}`, `Teacher / invigilator: ${event.instructor || 'not listed'}`, times ? '' : `Time slot: ${event.time || 'not stated'} (could not be read reliably, so this is an all-day event)`, 'Added from YouRMS Exam Finder'].filter(Boolean).join('\n');
                let dates;
                if (times) dates = `${formatGCalDate(event.date, times.start)}/${formatGCalDate(event.date, times.end)}`;
                else {
                  const next = new Date(event.date.getFullYear(), event.date.getMonth(), event.date.getDate() + 1);
                  const ymd = d => `${d.getFullYear()}${pad2(d.getMonth() + 1)}${pad2(d.getDate())}`;
                  dates = `${ymd(event.date)}/${ymd(next)}`;
                }
                const params = new URLSearchParams({ action: 'TEMPLATE', text: title, dates, details, location: event.room || '', ctz: TIME_ZONE });
                return `https://calendar.google.com/calendar/render?${params.toString()}`;
              }
              function calendarLink(event, { className = 'cal-link', text = true } = {}) {
                const note = parseTimeRange(event.time) ? '' : ' (all-day: time not readable)';
                return `<a class="${className}" href="${esc(googleCalendarURL(event))}" target="_blank" rel="noopener noreferrer" aria-label="Add ${esc(event.courseCode)} exam to Google Calendar" title="Add to Google Calendar${esc(note)}">${icon('calendar-plus')}${text ? '<span>Calendar</span>' : ''}</a>`;
              }

              /* DOM references and UI helpers */
              const $ = id => document.getElementById(id);
              const els = {
                courseCount: $('courseCount'), addRow: $('addRow'), search: $('courseSearch'), add: $('addBtn'),
                picker: $('picker'), pickerList: $('pickerList'), pickerCount: $('pickerCount'), pickerAll: $('pickerAll'), pickerClear: $('pickerClear'),
                courseList: $('courseList'), schedulePanel: $('schedulePanel'), download: $('downloadBtn'), toast: $('toastStack')
              };
              function toast(message, kind = 'info') {
                while (els.toast.children.length >= 3) els.toast.firstChild.remove();
                const node = document.createElement('div'); node.className = `toast ${kind}`; node.textContent = message; els.toast.appendChild(node);
                window.setTimeout(() => node.remove(), 3600);
              }

              /* Adding courses */
              function optionHTML(item, index) {
                const added = state.selected.includes(item.code), checked = added || state.picker.checked.has(item.code), name = CourseCatalog.nameFor(item.code);
                return `<div class="opt${added ? ' is-added' : ''}" role="option" id="opt-${index}" data-code="${esc(item.code)}" aria-selected="${checked}"${added ? ' aria-disabled="true"' : ''}><span class="box">${icon('check')}</span><span class="code">${esc(item.code)}</span><span class="oname">${name ? esc(name) : '<span class="muted">Name not listed</span>'}${item.via ? `<small>ID ${esc(item.via)}</small>` : ''}</span>${added ? '<span class="tag">Added</span>' : ''}</div>`;
              }
              function openPicker() { els.picker.hidden = false; els.search.setAttribute('aria-expanded', 'true'); }
              function closePicker() { els.picker.hidden = true; els.search.setAttribute('aria-expanded', 'false'); els.search.removeAttribute('aria-activedescendant'); state.picker.active = -1; }

                  const response = await fetch(url, { cache: 'no-store' });
                  if (!response.ok) throw new Error(`Could not fetch ${WORKBOOK_URL} (HTTP ${response.status}).`);
                  const buffer = await response.arrayBuffer(), workbook = window.XLSX.read(buffer, { type: 'array', cellDates: true, dense: false });
                  if (!workbook.SheetNames || !workbook.SheetNames.length) throw new Error('The Excel file does not contain a worksheet.');
                  const sheetName = workbook.SheetNames.find(name => /midterm|schedule/i.test(name)) || workbook.SheetNames[0];
                  const built = buildWorkbookRows(workbook.Sheets[sheetName]), stats = parseWorkbook(built.rows, built.startRow);
                  if (!stats.courseCount || !stats.entryCount) throw new Error('The workbook opened, but no course entries could be recognized.');
                  state.loaded = true; validateSelection(); renderCourseList(); renderSchedule(); if (!els.picker.hidden) renderPicker(); setControlsEnabled(true);
                } catch (error) { console.error(error); renderFailure(error); setControlsEnabled(false); }
              }

              /* Event wiring */
              function wireAdd() {
                els.search.addEventListener('input', renderPicker);
                els.search.addEventListener('focus', () => { if (els.picker.hidden) renderPicker(); });
                els.search.addEventListener('click', () => { if (els.picker.hidden) renderPicker(); });
                els.search.addEventListener('keydown', event => {
                  const count = state.picker.items.length;
                  if (event.key === 'ArrowDown') { event.preventDefault(); if (els.picker.hidden) renderPicker(); if (count) setActiveOption(state.picker.active + 1); }
                  else if (event.key === 'ArrowUp') { event.preventDefault(); if (count) setActiveOption(state.picker.active < 0 ? count - 1 : state.picker.active - 1); }
                  else if (event.key === 'Enter') { event.preventDefault(); const item = state.picker.items[state.picker.active]; if (item && event.shiftKey) toggleCode(item.code); else if (item && state.selected.includes(item.code)) toast(`${item.code} is already added.`, 'error'); else commitAdd(item?.code); }
                  else if (event.key === 'Escape') closePicker();
                });
                els.picker.addEventListener('mousedown', event => event.preventDefault());
                els.pickerList.addEventListener('click', event => {
                  const option = event.target.closest('.opt'); if (!option) return;
                  if (option.classList.contains('is-added')) { toast(`${option.dataset.code} is already added.`, 'error'); return; }
                  toggleCode(option.dataset.code);
                });
                els.pickerAll.addEventListener('click', () => {
                  state.picker.items.filter(item => !state.selected.includes(item.code)).forEach(item => state.picker.checked.add(item.code));
                  [...els.pickerList.querySelectorAll('.opt:not(.is-added)')].forEach(option => option.setAttribute('aria-selected', 'true')); updatePickerBar();
                });
                els.pickerClear.addEventListener('click', () => {
                  state.picker.checked.clear(); [...els.pickerList.querySelectorAll('.opt:not(.is-added)')].forEach(option => option.setAttribute('aria-selected', 'false')); updatePickerBar();
                });
                els.add.addEventListener('click', () => commitAdd());
                document.addEventListener('pointerdown', event => { if (!event.target.closest('#addRow')) closePicker(); });
                els.addRow.addEventListener('focusout', event => { if (!els.addRow.contains(event.relatedTarget)) closePicker(); });
              }
              function wireCourseList() {
                els.courseList.addEventListener('click', event => {
                  const remove = event.target.closest('[data-remove]'); if (remove) { removeCourse(remove.dataset.remove); return; }
                  const chip = event.target.closest('[data-section-for]'); if (!chip) return;
                  const code = chip.dataset.sectionFor, key = chip.dataset.key;
                  if (state.selectedSections.get(code) === key) state.selectedSections.delete(code); else state.selectedSections.set(code, key);
                  saveState(); updateCourseItem(code, key); renderSchedule();
                });
              }
              function wireSchedule() {
                document.querySelectorAll('[data-view]').forEach(button => button.addEventListener('click', () => setView(button.dataset.view)));
                els.download.addEventListener('click', downloadSchedule);
              }

              /* Start */
              applySavedState(Store.read()); wireAdd(); wireCourseList(); wireSchedule(); updateViewButtons(); loadWorkbook();
            })();
        </script>
    </body>
</html>
